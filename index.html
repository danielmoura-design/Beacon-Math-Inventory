        // --- SERVICES ---
        const generateInventoryPDF = (inventory, history) => {
            try {
                // Instantiate jsPDF class
                const doc = new jsPDF();
                
                // Title
                doc.setFontSize(18);
                doc.text('Maths Equipment Inventory Report', 14, 22);
                
                doc.setFontSize(11);
                doc.text(`Generated on: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, 14, 30);

                // Define columns for Inventory
                const tableColumn = ["Product Name", "Total Stock", "Loaned", "Available"];
                
                // Map data for Inventory
                const tableRows = inventory.map(item => {
                    const available = item.totalStock - item.loanedAmount;
                    return [
                    item.name,
                    item.totalStock.toString(),
                    item.loanedAmount.toString(),
                    available.toString()
                    ];
                });

                // Generate Inventory Table
                autoTable(doc, {
                    head: [tableColumn],
                    body: tableRows,
                    startY: 40,
                    headStyles: { fillColor: [22, 163, 74] }, // Green-600
                    styles: { fontSize: 9 },
                    alternateRowStyles: { fillColor: [240, 253, 244] }, // Green-50
                    // Highlight low stock or negative stock
                    didParseCell: (data) => {
                    if (data.section === 'body' && data.column.index === 3) {
                        const val = parseInt(data.cell.raw);
                        if (val === 0) {
                            data.cell.styles.textColor = [220, 38, 38]; // Red
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                    }
                });

                // --- ADD HISTORY SECTION ---
                
                // Determine start position for next table
                // @ts-ignore: lastAutoTable exists on jsPDF instance when plugin is loaded
                let finalY = doc.lastAutoTable?.finalY || 40;
                finalY += 15; // Add spacing

                // Check if we need a new page
                if (finalY > 250) {
                    doc.addPage();
                    finalY = 20;
                }

                doc.setFontSize(14);
                doc.text('Transaction History', 14, finalY);

                const historyColumn = ["Date & Time", "Person", "Action", "Item", "Qty"];
                
                // Sort history by date descending for report
                const sortedHistory = [...history].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

                const historyRows = sortedHistory.map(entry => [
                    new Date(entry.date).toLocaleString(),
                    entry.personName || "-",
                    entry.action,
                    entry.itemName,
                    entry.quantity.toString()
                ]);

                autoTable(doc, {
                    head: [historyColumn],
                    body: historyRows,
                    startY: finalY + 5,
                    headStyles: { fillColor: [75, 85, 99] }, // Gray-600 for history
                    styles: { fontSize: 8 },
                    alternateRowStyles: { fillColor: [243, 244, 246] }, // Gray-100
                });

                doc.save('maths-inventory.pdf');
            } catch (error) {
                console.error("PDF Export Error:", error);
                alert("Failed to export PDF. Please check the console for details.");
            }
        };

        // --- COMPONENTS ---

        // 1. Combobox (Unchanged)
        const Combobox = ({ items, selectedItem, onSelect, allowCustom = false }) => {
            const [query, setQuery] = useState('');
            const [isOpen, setIsOpen] = useState(false);
            const wrapperRef = useRef(null);

            // Close when clicking outside
            useEffect(() => {
                function handleClickOutside(event) {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [wrapperRef]);

            // Filter items based on query
            const filteredItems = useMemo(() => {
                return query === ''
                ? items
                : items.filter((item) =>
                    item.name.toLowerCase().includes(query.toLowerCase())
                    );
            }, [query, items]);

            const handleSelect = (item) => {
                onSelect(item);
                setQuery('');
                setIsOpen(false);
            };

            const handleCreateNew = () => {
                if (allowCustom && query.length > 0) {
                    onSelect(query); // Pass string for new item
                    setIsOpen(false);
                    setQuery('');
                }
            };

            return (
                <div className="relative w-full" ref={wrapperRef}>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Select Product</label>
                    <div className="relative">
                        <input
                        type="text"
                        className="w-full bg-white text-gray-900 border border-gray-300 rounded-md py-2 pl-3 pr-10 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm"
                        placeholder="Type to search..."
                        onChange={(event) => {
                            setQuery(event.target.value);
                            if(!isOpen) setIsOpen(true);
                            if(selectedItem && event.target.value !== selectedItem.name) {
                                onSelect(null); 
                            }
                        }}
                        onClick={() => setIsOpen(true)}
                        value={selectedItem ? selectedItem.name : query}
                        />
                        <div className="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                            <ChevronDown className="h-5 w-5 text-gray-400" aria-hidden="true" />
                        </div>
                    </div>

                    {isOpen && (
                        <ul className="absolute z-50 mt-1 w-full bg-white shadow-lg max-h-60 rounded-md py-1 text-base ring-1 ring-black ring-opacity-5 overflow-auto focus:outline-none sm:text-sm">
                            {filteredItems.length === 0 && query !== '' && !allowCustom && (
                                <li className="cursor-default select-none relative py-2 pl-3 pr-9 text-gray-700">
                                Nothing found.
                                </li>
                            )}
                            
                            {filteredItems.length === 0 && query !== '' && allowCustom && (
                                <li 
                                    className="cursor-pointer select-none relative py-2 pl-3 pr-9 text-green-700 hover:bg-green-50 font-medium flex items-center gap-2"
                                    onClick={handleCreateNew}
                                >
                                    <Plus size={16} /> Create "{query}"
                                </li>
                            )}

                            {filteredItems.map((item) => (
                                <li
                                key={item.id}
                                className={`cursor-pointer select-none relative py-2 pl-3 pr-9 hover:bg-green-100 ${
                                    selectedItem?.id === item.id ? 'bg-green-50 text-green-900' : 'text-gray-900'
                                }`}
                                onClick={() => handleSelect(item)}
                                >
                                <span className={`block truncate ${selectedItem?.id === item.id ? 'font-semibold' : 'font-normal'}`}>
                                    {item.name}
                                </span>
                                {selectedItem?.id === item.id && (
                                    <span className="absolute inset-y-0 right-0 flex items-center pr-4 text-green-600">
                                    <Check className="h-5 w-5" aria-hidden="true" />
                                    </span>
                                )}
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        };

        // 2. ActionScreen (Unchanged)
        const ActionScreen = ({ inventory, onUpdateInventory, onAddNewItem }) => {
            const [selectedItem, setSelectedItem] = useState(null);
            const [newItemName, setNewItemName] = useState('');
            const [amount, setAmount] = useState('');
            const [personName, setPersonName] = useState('');
            const [actionType, setActionType] = useState(ActionType.LOAN);
            const [message, setMessage] = useState(null);

            const activeItem = useMemo(() => {
                if (!selectedItem) return null;
                return inventory.find(i => i.id === selectedItem.id) || null;
            }, [selectedItem, inventory]);

            useEffect(() => {
                if (message) {
                const timer = setTimeout(() => setMessage(null), 5000);
                return () => clearTimeout(timer);
                }
            }, [message]);

            const handleComboboxSelect = (val) => {
                if (typeof val === 'string') {
                    setNewItemName(val);
                    setSelectedItem(null);
                    setActionType(ActionType.NEW_MATERIAL);
                } else {
                    setSelectedItem(val);
                    setNewItemName('');
                    if (actionType === ActionType.NEW_MATERIAL) {
                        setActionType(ActionType.LOAN);
                    }
                }
            };

            const handleActionChange = (type) => {
                setActionType(type);
                if (type !== ActionType.NEW_MATERIAL) {
                    setNewItemName('');
                } else {
                    setSelectedItem(null);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const qty = parseInt(amount);

                if (isNaN(qty) || qty <= 0) {
                setMessage({ type: 'error', text: 'Please enter a valid positive quantity.' });
                return;
                }

                if (actionType === ActionType.NEW_MATERIAL) {
                    if (!newItemName && !selectedItem) {
                        setMessage({ type: 'error', text: 'Please enter a product name.' });
                        return;
                    }
                    
                    if (activeItem) {
                        onUpdateInventory(activeItem, ActionType.NEW_MATERIAL, qty, personName);
                        setMessage({ type: 'success', text: `Added ${qty} units to inventory for "${activeItem.name}".` });
                    } else {
                        onAddNewItem(newItemName, qty, personName);
                        setMessage({ type: 'success', text: `Created new product "${newItemName}" with ${qty} units.` });
                        setNewItemName('');
                    }
                } else {
                    if (!activeItem) {
                        setMessage({ type: 'error', text: 'Please select a product from the list.' });
                        return;
                    }

                    const currentAvailable = activeItem.totalStock - activeItem.loanedAmount;

                    if (actionType === ActionType.LOAN) {
                        if (qty > currentAvailable) {
                        alert(`Not enough material available!\n\nCurrent Available: ${currentAvailable}\nRequested: ${qty}`);
                        return;
                        }
                        onUpdateInventory(activeItem, ActionType.LOAN, qty, personName);
                        setMessage({ type: 'success', text: `Successfully loaned ${qty} units of "${activeItem.name}".` });
                    } else if (actionType === ActionType.RETURN) {
                        if (qty > activeItem.loanedAmount) {
                            const confirm = window.confirm(`You are returning more than currently recorded as loaned (${activeItem.loanedAmount}). Continue?`);
                            if(!confirm) return;
                        }
                        onUpdateInventory(activeItem, ActionType.RETURN, qty, personName);
                        setMessage({ type: 'success', text: `Successfully returned ${qty} units of "${activeItem.name}".` });
                    }
                }
                setAmount('');
            };

            return (
                <div className="bg-white shadow rounded-lg p-6 max-w-2xl mx-auto mt-6">
                <h2 className="text-xl font-semibold text-gray-800 mb-6">Manage Inventory</h2>
                
                <form onSubmit={handleSubmit} className="space-y-6">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Person Name (Optional)</label>
                        <div className="relative">
                            <input
                                type="text"
                                value={personName}
                                onChange={(e) => setPersonName(e.target.value)}
                                className="w-full bg-white text-gray-900 border border-gray-300 rounded-md py-2 pl-3 pr-10 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm"
                                placeholder="Enter name of person..."
                            />
                             <div className="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
                                <User className="h-5 w-5 text-gray-400" aria-hidden="true" />
                            </div>
                        </div>
                    </div>

                    <div>
                    <Combobox 
                        items={inventory} 
                        selectedItem={selectedItem} 
                        onSelect={handleComboboxSelect}
                        allowCustom={true} 
                    />
                    
                    {activeItem && actionType !== ActionType.NEW_MATERIAL && (
                        <div className="mt-2 p-3 bg-blue-50 rounded-md flex items-center justify-between text-sm text-blue-900">
                             <div className="flex items-center gap-2">
                                <Info size={16} />
                                <span className="font-semibold">Current Status:</span>
                             </div>
                             <div className="flex gap-4">
                                <span>Total: <b>{activeItem.totalStock}</b></span>
                                <span>Loaned: <b>{activeItem.loanedAmount}</b></span>
                                <span>Available: <b className="text-green-700 text-base">{activeItem.totalStock - activeItem.loanedAmount}</b></span>
                             </div>
                        </div>
                    )}
                    
                    {newItemName && actionType === ActionType.NEW_MATERIAL && (
                        <p className="text-xs text-green-600 mt-1">Creating new product: {newItemName}</p>
                    )}
                    </div>

                    <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                    <input
                        type="number"
                        min="1"
                        value={amount}
                        onChange={(e) => setAmount(e.target.value)}
                        className="w-full bg-white text-gray-900 border border-gray-300 rounded-md py-2 px-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm"
                        placeholder="0"
                    />
                    </div>

                    <div className="grid grid-cols-3 gap-4">
                    <label className={`
                        cursor-pointer border rounded-md p-3 text-center transition-colors
                        ${actionType === ActionType.LOAN ? 'bg-red-50 border-red-500 text-red-700 ring-1 ring-red-500' : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50'}
                    `}>
                        <input 
                        type="radio" 
                        name="action" 
                        className="sr-only" 
                        checked={actionType === ActionType.LOAN} 
                        onChange={() => handleActionChange(ActionType.LOAN)} 
                        />
                        <span className="font-medium">Loan Out</span>
                    </label>

                    <label className={`
                        cursor-pointer border rounded-md p-3 text-center transition-colors
                        ${actionType === ActionType.RETURN ? 'bg-blue-50 border-blue-500 text-blue-700 ring-1 ring-blue-500' : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50'}
                    `}>
                        <input 
                        type="radio" 
                        name="action" 
                        className="sr-only" 
                        checked={actionType === ActionType.RETURN} 
                        onChange={() => handleActionChange(ActionType.RETURN)} 
                        />
                        <span className="font-medium">Return</span>
                    </label>

                    <label className={`
                        cursor-pointer border rounded-md p-3 text-center transition-colors
                        ${actionType === ActionType.NEW_MATERIAL ? 'bg-green-50 border-green-500 text-green-700 ring-1 ring-green-500' : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50'}
                    `}>
                        <input 
                        type="radio" 
                        name="action" 
                        className="sr-only" 
                        checked={actionType === ActionType.NEW_MATERIAL} 
                        onChange={() => handleActionChange(ActionType.NEW_MATERIAL)} 
                        />
                        <span className="font-medium">New Material</span>
                    </label>
                    </div>

                    <button
                    type="submit"
                    className="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors"
                    >
                    Process Transaction
                    </button>
                </form>

                {message && (
                    <div className={`mt-4 p-4 rounded-md flex items-center ${message.type === 'success' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                        {message.type === 'success' ? <CheckCircle className="w-5 h-5 mr-2" /> : <AlertCircle className="w-5 h-5 mr-2" />}
                        {message.text}
                    </div>
                )}
                </div>
            );
        };

        // 3. InventoryTable (Unchanged)
        const InventoryTable = ({ inventory, onDelete }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [itemToDelete, setItemToDelete] = useState(null);

            const filteredInventory = inventory
                .filter(item => 
                item.name.toLowerCase().includes(searchTerm.toLowerCase())
                )
                .sort((a, b) => a.name.localeCompare(b.name));

            const confirmDelete = () => {
                if (itemToDelete) {
                onDelete(itemToDelete.id);
                setItemToDelete(null);
                }
            };

            return (
                <>
                <div className="bg-white shadow rounded-lg overflow-hidden mt-6 flex flex-col h-[calc(100vh-200px)] relative">
                    <div className="px-6 py-4 border-b border-gray-200 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h2 className="text-lg font-medium text-gray-900">Current Inventory Status</h2>
                    
                    <div className="relative w-full sm:w-64">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Search className="h-5 w-5 text-gray-400" />
                        </div>
                        <input
                        type="text"
                        className="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white text-gray-900 placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:border-blue-300 focus:ring focus:ring-blue-200 sm:text-sm transition duration-150 ease-in-out"
                        placeholder="Search items..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                    
                    <span className="text-sm text-gray-500 hidden sm:block">{inventory.length} items listed</span>
                    </div>
                    
                    <div className="overflow-auto flex-1">
                    <table className="min-w-full divide-y divide-gray-200">
                        <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/2">
                            Product Name
                            </th>
                            <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Total Stock
                            </th>
                            <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Loaned Out
                            </th>
                            <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Current Available
                            </th>
                            <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Actions
                            </th>
                        </tr>
                        </thead>
                        <tbody className="bg-white divide-y divide-gray-200">
                        {filteredInventory.map((item) => {
                            const available = item.totalStock - item.loanedAmount;
                            const isLow = available === 0;
                            const isNegative = available < 0;

                            return (
                            <tr key={item.id} className="hover:bg-gray-50">
                                <td className="px-6 py-4 text-sm font-medium text-gray-900">
                                {item.name}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">
                                {item.totalStock}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">
                                {item.loanedAmount}
                                </td>
                                <td className={`px-6 py-4 whitespace-nowrap text-sm font-bold text-center ${
                                    isNegative ? 'text-red-600' : isLow ? 'text-orange-500' : 'text-green-600'
                                }`}>
                                {available}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-center">
                                <button 
                                    onClick={() => setItemToDelete(item)}
                                    className="text-gray-400 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500"
                                    title="Delete Item"
                                    type="button"
                                >
                                    <Trash2 className="h-5 w-5" />
                                </button>
                                </td>
                            </tr>
                            );
                        })}
                        
                        {filteredInventory.length === 0 && (
                            <tr>
                                <td colSpan="5" className="px-6 py-10 text-center text-gray-500">
                                    {searchTerm ? 'No items found matching your search.' : 'No items in inventory.'}
                                </td>
                            </tr>
                        )}
                        </tbody>
                    </table>
                    </div>
                </div>

                {itemToDelete && (
                    <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                    <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                        <div 
                        className="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" 
                        aria-hidden="true"
                        onClick={() => setItemToDelete(null)}
                        ></div>
                        <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                        <div className="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full">
                        <div className="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                            <div className="sm:flex sm:items-start">
                            <div className="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
                                <AlertTriangle className="h-6 w-6 text-red-600" aria-hidden="true" />
                            </div>
                            <div className="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                                <h3 className="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                Delete Item
                                </h3>
                                <div className="mt-2">
                                <p className="text-sm text-gray-500">
                                    Are you sure you want to delete <span className="font-bold text-gray-800">{itemToDelete.name}</span>? 
                                    This action cannot be undone.
                                </p>
                                </div>
                            </div>
                            </div>
                        </div>
                        <div className="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                            <button
                            type="button"
                            className="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm"
                            onClick={confirmDelete}
                            >
                            Delete
                            </button>
                            <button
                            type="button"
                            className="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm"
                            onClick={() => setItemToDelete(null)}
                            >
                            Cancel
                            </button>
                        </div>
                        </div>
                    </div>
                    </div>
                )}
                </>
            );
        };

        // 4. HistoryTable (Updated with Delete)
        const HistoryTable = ({ history, onDeleteEntry, onClearHistory }) => {
            const [searchTerm, setSearchTerm] = useState('');

            // Sort history by date descending (newest first)
            const sortedHistory = [...history].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

            const filteredHistory = sortedHistory.filter(entry => 
                entry.personName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                entry.itemName.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="bg-white shadow rounded-lg overflow-hidden mt-6 flex flex-col h-[calc(100vh-200px)] relative">
                    <div className="px-6 py-4 border-b border-gray-200 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h2 className="text-lg font-medium text-gray-900">Transactions History</h2>
                    
                    <div className="relative w-full sm:w-64">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Search className="h-5 w-5 text-gray-400" />
                        </div>
                        <input
                        type="text"
                        className="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white text-gray-900 placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:border-blue-300 focus:ring focus:ring-blue-200 sm:text-sm transition duration-150 ease-in-out"
                        placeholder="Search history..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                    
                    <div className="flex items-center gap-2">
                        <span className="text-sm text-gray-500 hidden sm:block mr-2">{history.length} transactions</span>
                        <button 
                            onClick={onClearHistory}
                            className="inline-flex items-center px-3 py-1 border border-transparent rounded-md text-sm font-medium text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                        >
                            <Trash2 className="w-4 h-4 mr-1" /> Clear All History
                        </button>
                    </div>
                    </div>
                    
                    <div className="overflow-auto flex-1">
                    <table className="min-w-full divide-y divide-gray-200">
                        <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Date & Time
                            </th>
                            <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Person Name
                            </th>
                            <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Action
                            </th>
                            <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/3">
                            Item Name
                            </th>
                            <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Quantity
                            </th>
                            <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                            
                            </th>
                        </tr>
                        </thead>
                        <tbody className="bg-white divide-y divide-gray-200">
                        {filteredHistory.map((entry) => {
                            let badgeClass = "bg-gray-100 text-gray-800";
                            if (entry.action === ActionType.LOAN) badgeClass = "bg-red-100 text-red-800";
                            else if (entry.action === ActionType.RETURN) badgeClass = "bg-blue-100 text-blue-800";
                            else if (entry.action === ActionType.NEW_MATERIAL) badgeClass = "bg-green-100 text-green-800";

                            return (
                            <tr key={entry.id} className="hover:bg-gray-50">
                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                {new Date(entry.date).toLocaleString()}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                {entry.personName || "-"}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-sm">
                                <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${badgeClass}`}>
                                    {entry.action === ActionType.NEW_MATERIAL ? 'NEW STOCK' : entry.action}
                                </span>
                                </td>
                                <td className="px-6 py-4 text-sm text-gray-500">
                                {entry.itemName}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-bold text-center">
                                {entry.quantity}
                                </td>
                                <td className="px-6 py-4 whitespace-nowrap text-right">
                                    <button 
                                        onClick={() => onDeleteEntry(entry.id)}
                                        className="text-gray-400 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-red-50"
                                        title="Delete Entry"
                                    >
                                        <Trash2 className="h-4 w-4" />
                                    </button>
                                </td>
                            </tr>
                            );
                        })}
                        
                        {filteredHistory.length === 0 && (
                            <tr>
                                <td colSpan="6" className="px-6 py-10 text-center text-gray-500">
                                    {searchTerm ? 'No history found matching your search.' : 'No transaction history available.'}
                                </td>
                            </tr>
                        )}
                        </tbody>
                    </table>
                    </div>
                </div>
            );
        };

        // 5. DataExport (Updated PDF export)
        const DataExport = ({ inventory, history, onImport }) => {
            const fileInputRef = useRef(null);

            const handleManualSave = () => {
                const backupObject = {
                    version: 1,
                    timestamp: new Date().toISOString(),
                    inventory: inventory,
                    history: history
                };
                
                const dataStr = JSON.stringify(backupObject, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `maths-inventory-full-backup-${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleManualLoad = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                
                reader.onerror = () => {
                    alert('Error reading file. Please try again.');
                };

                reader.onload = (e) => {
                    try {
                        const result = e.target?.result;
                        if (!result) throw new Error("Empty file content");
                        
                        const parsedData = JSON.parse(result);

                        // Helper functions
                        const sanitizeInventory = (items) => {
                            if (!Array.isArray(items)) return [];
                            return items.map(item => ({
                                ...item,
                                totalStock: Number(item.totalStock || 0),
                                loanedAmount: Number(item.loanedAmount || 0)
                            }));
                        };

                        const sanitizeHistory = (entries) => {
                            if (!Array.isArray(entries)) return [];
                            return entries.map(entry => ({
                                ...entry,
                                quantity: Number(entry.quantity || 0)
                            }));
                        };
                        
                        if (parsedData.inventory && Array.isArray(parsedData.inventory)) {
                            if(window.confirm('This will overwrite ALL current inventory and history data. Are you sure?')) {
                                const cleanInventory = sanitizeInventory(parsedData.inventory);
                                const cleanHistory = sanitizeHistory(parsedData.history || []);
                                onImport(cleanInventory, cleanHistory);
                                alert('Full backup loaded successfully.');
                            }
                        }
                        else if (Array.isArray(parsedData)) {
                            if(window.confirm('This appears to be an older backup file containing only inventory. This will overwrite inventory and CLEAR history. Continue?')) {
                                const cleanInventory = sanitizeInventory(parsedData);
                                onImport(cleanInventory, []); // Clear history for old files
                                alert('Inventory loaded. History reset.');
                            }
                        } else {
                            alert('Invalid file format. Expected JSON object with inventory/history or Array of items.');
                        }
                    } catch (err) {
                        console.error("File Load Error:", err);
                        alert('Error parsing JSON file. Please ensure the file is valid and not corrupted.');
                    }
                };
                reader.readAsText(file);
                event.target.value = ''; 
            };

            return (
                <div className="bg-white shadow rounded-lg p-6 max-w-2xl mx-auto mt-6">
                <h2 className="text-xl font-semibold text-gray-800 mb-6">Data Management & Export</h2>
                
                <div className="space-y-8">
                    <div className="border-b pb-6">
                        <h3 className="text-lg font-medium text-gray-700 mb-2">Report Generation</h3>
                        <p className="text-sm text-gray-500 mb-4">Download a PDF summary of all items, total stock, current availability, and full transaction history.</p>
                        <button
                            onClick={() => generateInventoryPDF(inventory, history)}
                            className="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                        >
                            <FileText className="mr-2 h-5 w-5" />
                            Export to PDF
                        </button>
                    </div>

                    <div>
                        <h3 className="text-lg font-medium text-gray-700 mb-2">Backup & Restore</h3>
                        <p className="text-sm text-gray-500 mb-4">Save your data to your computer manually or restore from a previous backup file.</p>
                        
                        <div className="flex gap-4 flex-wrap">
                            <button
                                onClick={handleManualSave}
                                className="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                            >
                                <FileDown className="mr-2 h-5 w-5" />
                                Save Full Backup (JSON)
                            </button>

                            <div className="relative">
                                <input
                                    type="file"
                                    accept=".json"
                                    ref={fileInputRef}
                                    className="hidden"
                                    onChange={handleManualLoad}
                                />
                                <button
                                    onClick={() => fileInputRef.current?.click()}
                                    className="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                                >
                                    <FileUp className="mr-2 h-5 w-5" />
                                    Load Backup (JSON)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
            );
        };

        // 6. App Component
        const STORAGE_KEY = 'maths_inventory_data_v1';
        const HISTORY_KEY = 'maths_inventory_history_v1';

        const App = () => {
            const [activeTab, setActiveTab] = useState('action');
            const [inventory, setInventory] = useState([]);
            const [history, setHistory] = useState([]);
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                const savedData = localStorage.getItem(STORAGE_KEY);
                const savedHistory = localStorage.getItem(HISTORY_KEY);

                if (savedData) {
                    try {
                        setInventory(JSON.parse(savedData));
                    } catch (e) {
                        setInventory(INITIAL_INVENTORY_DATA);
                    }
                } else {
                    setInventory(INITIAL_INVENTORY_DATA);
                }

                if (savedHistory) {
                    try {
                        setHistory(JSON.parse(savedHistory));
                    } catch (e) {
                        setHistory([]);
                    }
                }

                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                }
            }, [inventory, history, isLoaded]);

            const logTransaction = (action, itemName, quantity, personName) => {
                const newEntry = {
                    id: uuid(),
                    date: new Date().toISOString(),
                    action,
                    itemName,
                    quantity,
                    personName
                };
                setHistory(prev => [newEntry, ...prev]);
            };

            // History Management
            const handleDeleteHistoryEntry = (id) => {
                if(window.confirm('Are you sure you want to delete this history record? This will NOT affect current inventory stock.')) {
                    setHistory(prev => prev.filter(entry => entry.id !== id));
                }
            };

            const handleClearHistory = () => {
                if(window.confirm('Are you sure you want to delete ALL history? This action cannot be undone and will NOT affect current inventory stock.')) {
                    setHistory([]);
                }
            };

            const handleUpdateInventory = (item, action, quantity, personName) => {
                setInventory(prev => prev.map(i => {
                    if (i.id !== item.id) return i;

                    let newLoaned = i.loanedAmount;
                    let newTotal = i.totalStock;

                    if (action === ActionType.LOAN) {
                        newLoaned += quantity;
                    } else if (action === ActionType.RETURN) {
                        newLoaned = Math.max(0, newLoaned - quantity);
                    } else if (action === ActionType.NEW_MATERIAL) {
                        newTotal += quantity;
                    }

                    return { ...i, loanedAmount: newLoaned, totalStock: newTotal };
                }));
                logTransaction(action, item.name, quantity, personName);
            };

            const handleAddNewItem = (name, initialQuantity, personName) => {
                const newItem = {
                    id: Math.random().toString(36).substring(2, 9),
                    name,
                    totalStock: initialQuantity,
                    loanedAmount: 0
                };
                setInventory(prev => [...prev, newItem]);
                logTransaction(ActionType.NEW_MATERIAL, name, initialQuantity, personName);
            };

            const handleDeleteItem = (id) => {
                setInventory(prev => prev.filter(item => item.id !== id));
            };

            const handleImport = (newInventory, newHistory) => {
                setInventory(newInventory);
                setHistory(newHistory);
            };

            if (!isLoaded) return <div className="p-10 text-center">Loading...</div>;

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                <header className="bg-white shadow-sm z-20">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between h-16 items-center">
                        <div className="flex items-center gap-2">
                            <div className="bg-blue-600 text-white p-2 rounded-lg">
                            <Calculator size={24} />
                            </div>
                            <h1 className="text-xl font-bold text-gray-900">Maths Inventory</h1>
                        </div>
                    </div>
                    </div>
                </header>

                <div className="bg-white border-b border-gray-200">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <nav className="-mb-px flex space-x-8" aria-label="Tabs">
                        <button
                            onClick={() => setActiveTab('action')}
                            className={`${
                            activeTab === 'action'
                                ? 'border-blue-500 text-blue-600'
                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                            } group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm`}
                        >
                            <Calculator className={`-ml-0.5 mr-2 h-5 w-5 ${activeTab === 'action' ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-500'}`} />
                            Loans & Returns
                        </button>

                        <button
                            onClick={() => setActiveTab('list')}
                            className={`${
                            activeTab === 'list'
                                ? 'border-blue-500 text-blue-600'
                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                            } group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm`}
                        >
                            <List className={`-ml-0.5 mr-2 h-5 w-5 ${activeTab === 'list' ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-500'}`} />
                            Inventory List
                        </button>

                        <button
                            onClick={() => setActiveTab('history')}
                            className={`${
                            activeTab === 'history'
                                ? 'border-blue-500 text-blue-600'
                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                            } group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm`}
                        >
                            <History className={`-ml-0.5 mr-2 h-5 w-5 ${activeTab === 'history' ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-500'}`} />
                            History
                        </button>

                        <button
                            onClick={() => setActiveTab('export')}
                            className={`${
                            activeTab === 'export'
                                ? 'border-blue-500 text-blue-600'
                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                            } group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm`}
                        >
                            <Download className={`-ml-0.5 mr-2 h-5 w-5 ${activeTab === 'export' ? 'text-blue-500' : 'text-gray-400 group-hover:text-gray-500'}`} />
                            Export & Save
                        </button>
                        </nav>
                    </div>
                </div>

                <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                    {activeTab === 'action' && (
                    <ActionScreen 
                        inventory={inventory} 
                        onUpdateInventory={handleUpdateInventory} 
                        onAddNewItem={handleAddNewItem}
                    />
                    )}
                    {activeTab === 'list' && (
                    <InventoryTable inventory={inventory} onDelete={handleDeleteItem} />
                    )}
                    {activeTab === 'history' && (
                    <HistoryTable 
                        history={history} 
                        onDeleteEntry={handleDeleteHistoryEntry}
                        onClearHistory={handleClearHistory}
                    />
                    )}
                    {activeTab === 'export' && (
                    <DataExport inventory={inventory} history={history} onImport={handleImport} />
                    )}
                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
